rubrics:
  - id: 1
    type: f2p
    text: 配置 RuntimeSize 时，mkosi vm 和 mkosi vmspawn 只对磁盘镜像执行成长准备，非磁盘格式不进入该流程。
  - id: 2
    type: f2p
    text: mkosi vm 与 mkosi vmspawn 对同一目标尺寸使用一致的启动前准备语义，成功启动后虚拟机看到相同的目标尺寸。
  - id: 3
    type: f2p
    text: 磁盘成长在受保护的工作副本上完成，扩展失败时构建产物的尺寸和原有字节保持不变。
  - id: 4
    type: f2p
    text: 只有分区扩展和启动准备都成功后才使用成长后的镜像，失败的准备不会被当作已完成启动。
  - id: 5
    type: f2p
    text: 分区操作或根分区探测失败时保留原始镜像并清理或记录可供下一次运行处理的未完成准备。
  - id: 6
    type: f2p
    text: 镜像锁冲突或虚拟机进程启动失败时不覆盖源镜像，后续运行能够确定地清理或继续未完成准备。
  - id: 7
    type: p2p
    text: 成功启动后的镜像保留扩展前的全部数据内容，同时虚拟机可观察到请求的目标尺寸。
  - id: 8
    type: p2p
    text: 临时模式、已有分区布局和未配置 RuntimeSize 的启动行为保持兼容。
